name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile server.py
      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
      - name: Shell syntax + shellcheck
        run: |
          for f in *.sh; do bash -n "$f"; done
          shellcheck -S error *.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the clone (non-interactive wizard)
        run: sudo bash install.sh --yes --lang en --port 28090
      - name: Service answers
        run: |
          systemctl is-active gabo-commander
          curl -fsS http://127.0.0.1:28090/api/info | tee info.json
          grep -q "\"version\": \"$(cat VERSION)\"" info.json
          curl -fsS http://127.0.0.1:28090/ | grep -q 'i18n.js'
          curl -sS -H 'X-GC-Lang: hu' 'http://127.0.0.1:28090/api/list?path=/nincs' | grep -q 'Nem mappa'
          curl -sS -H 'X-GC-Lang: en' 'http://127.0.0.1:28090/api/list?path=/nincs' | grep -q 'Not a folder'
      - name: Zip download, pack and unpack
        run: |
          mkdir -p /tmp/gct/src/sub && echo hello > /tmp/gct/src/a.txt && head -c 100000 /dev/urandom > /tmp/gct/src/sub/b.bin
          sudo chown -R "$(sed -n 's/^User=//p' /etc/systemd/system/gabo-commander.service)" /tmp/gct
          curl -fsS -o /tmp/dl.zip 'http://127.0.0.1:28090/api/zip?dir=/tmp/gct/src&n=a.txt&n=sub'
          unzip -l /tmp/dl.zip && unzip -tq /tmp/dl.zip
          H='-H X-GC:1 -H Content-Type:application/json'
          curl -fsS $H -d '{"sources":["/tmp/gct/src"],"dest":"/tmp/gct/a.tar.xz","format":"tar.xz"}' http://127.0.0.1:28090/api/pack
          for i in $(seq 1 20); do [ -f /tmp/gct/a.tar.xz ] && break; sleep 0.5; done
          curl -fsS $H -d '{"archives":["/tmp/gct/a.tar.xz"],"dest":"/tmp/gct/out","subdir":true}' http://127.0.0.1:28090/api/unpack
          for i in $(seq 1 20); do [ -f /tmp/gct/out/a/src/sub/b.bin ] && break; sleep 0.5; done
          sleep 1; cmp /tmp/gct/src/sub/b.bin /tmp/gct/out/a/src/sub/b.bin
          test -d /var/lib/gabo-commander
      - name: Browse archives and multi-rename
        run: |
          H='-H X-GC:1 -H Content-Type:application/json'
          curl -fsS 'http://127.0.0.1:28090/api/list?path=/tmp/gct/a.tar.xz/src/sub' | grep -q '"b.bin"'
          curl -fsS -o /tmp/b.bin 'http://127.0.0.1:28090/api/raw?path=/tmp/gct/a.tar.xz/src/sub/b.bin'
          cmp /tmp/gct/src/sub/b.bin /tmp/b.bin
          mkdir -p /tmp/gct/ex && sudo chown "$(sed -n 's/^User=//p' /etc/systemd/system/gabo-commander.service)" /tmp/gct/ex
          curl -fsS $H -d '{"path":"/tmp/gct/a.tar.xz/src","names":["sub"],"dest":"/tmp/gct/ex"}' http://127.0.0.1:28090/api/extract
          for i in $(seq 1 20); do [ -f /tmp/gct/ex/sub/b.bin ] && break; sleep 0.5; done
          sleep 1; cmp /tmp/gct/src/sub/b.bin /tmp/gct/ex/sub/b.bin; test ! -e /tmp/gct/ex/a.txt
          curl -fsS $H -d '{"dir":"/tmp/gct/out/a/src","pairs":[["a.txt","sub"],["sub","a.txt"]]}' http://127.0.0.1:28090/api/multirename | grep -q '"errors": \[\]'
          test -d /tmp/gct/out/a/src/a.txt && test -f /tmp/gct/out/a/src/sub
      - name: Management command
        run: |
          gabo-commander version
          sudo gabo-commander status
          sudo gabo-commander update --force
          systemctl is-active gabo-commander
          curl -fsS http://127.0.0.1:28090/api/info
      - name: Hardlinks are safe (delete one name, move onto the other)
        run: |
          H='-H X-GC:1 -H Content-Type:application/json'
          mkdir -p /tmp/hl/a /tmp/hl/b && head -c 50000 /dev/urandom > /tmp/hl/a/f.bin && ln /tmp/hl/a/f.bin /tmp/hl/b/f.bin
          cp /tmp/hl/a/f.bin /tmp/hl.orig
          sudo chown -R "$(sed -n 's/^User=//p' /etc/systemd/system/gabo-commander.service)" /tmp/hl
          curl -fsS $H -d '{"sources":["/tmp/hl/a/f.bin"],"dest":"/tmp/hl/b","move":true,"policy":"overwrite"}' http://127.0.0.1:28090/api/copy
          for i in $(seq 1 20); do [ ! -e /tmp/hl/a/f.bin ] && break; sleep 0.5; done
          test ! -e /tmp/hl/a/f.bin && cmp /tmp/hl.orig /tmp/hl/b/f.bin
          ln /tmp/hl/b/f.bin /tmp/hl/a/g.bin
          curl -fsS $H -d '{"paths":["/tmp/hl/a/g.bin"]}' http://127.0.0.1:28090/api/delete
          for i in $(seq 1 20); do [ ! -e /tmp/hl/a/g.bin ] && break; sleep 0.5; done
          test ! -e /tmp/hl/a/g.bin && cmp /tmp/hl.orig /tmp/hl/b/f.bin
      - name: Update from the UI (systemd path unit)
        run: |
          systemctl is-enabled gabo-commander-update.path
          curl -fsS http://127.0.0.1:28090/api/info | tee info.json
          grep -q '"selfupdate": true' info.json
          curl -fsS -H 'X-GC: 1' -X POST http://127.0.0.1:28090/api/selfupdate
          for i in $(seq 1 90); do sudo grep -q '^== exit' /var/log/gabo-commander-update.log 2>/dev/null && break; sleep 1; done
          sudo cat /var/log/gabo-commander-update.log
          sudo grep -q '^== exit 0' /var/log/gabo-commander-update.log
          sudo test ! -e /var/lib/gabo-commander/update-request
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:28090/api/selfupdate >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:28090/api/selfupdate | grep -q '"done": true'
      - name: Reinstall keeps the settings
        run: |
          sudo bash /opt/gabo-commander/install.sh --yes
          grep -q '^GC_PORT=28090' /etc/gabo-commander.env || sudo grep -q '^GC_PORT=28090' /etc/gabo-commander.env
          curl -fsS http://127.0.0.1:28090/api/info
      - name: Log on failure
        if: failure()
        run: sudo journalctl -u gabo-commander -n 50 --no-pager || true
